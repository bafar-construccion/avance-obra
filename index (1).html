<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de avance de obra · Grupo Bafar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#eef2f5;--panel:#fff;--ink:#13212f;--ink2:#46576a;--mut:#74869a;--line:#d3dce4;--line2:#e5ebf0;--nav:#0b2a5b;--navink:#eef3f7;
 --hv:#7fa3e0;--acc:#0b2a5b;--accink:#fff;--accl:#0b2a5b;--ok:#1b8553;--okbg:#ddf3e7;--prog:#2563c9;--progbg:#e1ecfc;--late:#cc332e;--latebg:#fde6e5;--pend:#7d8c9b;--pendbg:#ebf0f3;
 --steel:#5b7a99;--real:#d4700c;--sel:#e6eefb;--shadow:0 1px 2px rgba(19,33,47,.08),0 4px 14px rgba(19,33,47,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--panel:#15222f;--ink:#e6edf3;--ink2:#a8b6c4;--mut:#7e8e9e;--line:#2a3b4c;--line2:#1f2e3c;--nav:#08172f;--navink:#e6edf3;--hv:#4a7fe0;--acc:#3f73d8;--accink:#fff;--accl:#8fb0ee;--okbg:#123626;--progbg:#15294a;--latebg:#3b1b1b;--pendbg:#1d2a36;--steel:#7da0c4;--real:#ffa733;--sel:#1a2c4a;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0d1620;--panel:#15222f;--ink:#e6edf3;--ink2:#a8b6c4;--mut:#7e8e9e;--line:#2a3b4c;--line2:#1f2e3c;--nav:#08172f;--navink:#e6edf3;--hv:#4a7fe0;--acc:#3f73d8;--accink:#fff;--accl:#8fb0ee;--okbg:#123626;--progbg:#15294a;--latebg:#3b1b1b;--pendbg:#1d2a36;--steel:#7da0c4;--real:#ffa733;--sel:#1a2c4a;--shadow:0 1px 2px rgba(0,0,0,.4)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;margin:0;font-weight:600;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.sm{font-size:12px}.b{font-weight:600}
a{color:var(--prog)}
/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--nav);color:var(--navink);display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;background:repeating-linear-gradient(-45deg,#4a7fe0 0 9px,var(--nav) 9px 18px)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:6px}
.brand b{font:700 18px 'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;letter-spacing:.01em}
.brand span{font-size:12px;opacity:.65}
.top select,.top input[type=date]{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:5px 8px;color:var(--navink);max-width:260px}
.top select option{color:#13212f}
.top label{font-size:12px;opacity:.75;display:flex;align-items:center;gap:6px}
.sync{margin-left:auto;font-size:12px;opacity:.8;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#4ad08a;display:inline-block}
.sync.saving i{background:#f2b01e}.sync.err i{background:#ff6b64}.sync.local i{background:#9aa9b8}
.tabs{display:flex;gap:2px;padding:14px 16px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 14px;font:600 14px 'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;color:var(--ink2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accl)}
.tab small{font-weight:500;color:var(--mut);margin-left:4px}
main{padding:14px 16px 60px;max-width:1500px;margin:0 auto}
/* botones */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:600}
.btn.pri:hover{filter:brightness(1.18)}
.btn.dng{color:var(--late);border-color:var(--late)}
.btn.dng.solid{background:var(--late);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}.btn.ghost{border-color:transparent;background:transparent}
.btn.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--prog);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;border-right:1px solid var(--line);font-weight:500}
.seg button:last-child{border-right:0}.seg button.on{background:var(--acc);color:var(--accink)}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;resize:vertical}
.bar-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sp{flex:1}
/* tarjetas */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card>h3,.card .hd{padding:11px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;font-size:15px}
.card .bd{padding:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:12px 14px}.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font:600 28px 'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;line-height:1.15;font-variant-numeric:tabular-nums}.kpi .s{font-size:12px;color:var(--ink2)}
.pos{color:var(--ok)}.neg{color:var(--late)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.Terminada,.chip.lib{background:var(--okbg);color:var(--ok)}
.chip.En-proceso,.chip.proc{background:var(--progbg);color:var(--prog)}
.chip.Atrasada,.chip.nolib{background:var(--latebg);color:var(--late)}
.chip.Pendiente,.chip.pend{background:var(--pendbg);color:var(--pend)}
/* tablas */
.tw{overflow:auto;max-width:100%}
table.t{border-collapse:collapse;width:100%}
.t th{background:var(--pendbg);text-align:left;padding:7px 10px;font-size:12px;color:var(--ink2);font-weight:600;position:sticky;top:0;white-space:nowrap}
.t td{padding:7px 10px;border-top:1px solid var(--line2);vertical-align:top}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--sel)}
.t td.r,.t th.r{text-align:right}
.empty{padding:40px 20px;text-align:center;color:var(--ink2)}
.empty h3{font-size:20px;color:var(--ink);margin-bottom:6px}
.banner{border:1px solid var(--hv);background:var(--sel);border-radius:9px;padding:10px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* barras de avance */
.pb{position:relative;height:10px;background:var(--pendbg);border-radius:5px;min-width:80px}
.pb i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--real)}
.pb u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--steel);text-decoration:none}
.hbar{display:grid;grid-template-columns:90px 1fr 56px;gap:10px;align-items:center;margin:6px 0}
.hbar .pb{height:14px}
/* gantt */
.gwrap{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
#gscroll{overflow:auto;max-height:calc(100vh - 240px);min-height:320px;position:relative}
.gbody{position:relative}
.grow{display:flex;height:30px;border-top:1px solid var(--line2)}
.grow:hover .gl{background:var(--sel)}
.grow.sum{background:color-mix(in srgb,var(--pendbg) 70%,transparent);font-weight:600}
.grow.sel .gl{background:var(--sel)}
.ghead{position:sticky;top:0;z-index:5;display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.gl{position:sticky;left:0;z-index:3;background:var(--panel);display:flex;align-items:center;flex:none;border-right:1px solid var(--line)}
.ghead .gl{background:var(--pendbg);height:44px;z-index:6;font-size:12px;font-weight:600;color:var(--ink2)}
.gc{flex:none;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px}
.gc.id{width:46px;color:var(--mut)}.gc.nm{width:292px;padding-left:2px;cursor:pointer;display:flex;align-items:center}
.gc.d{width:52px;text-align:right}.gc.dt{width:88px}.gc.p{width:48px;text-align:right}
.gc input{width:100%;padding:2px 3px;font-size:12px}
.gc.nm .tx{overflow:hidden;text-overflow:ellipsis}
.gc.nm .tg{width:18px;flex:none;color:var(--mut);cursor:pointer;text-align:center;user-select:none}
.gc.nm .x{font-size:11px;color:var(--mut);margin-left:6px;flex:none}
.gt{position:relative;flex:none}
.ghead .gt{height:44px}
.mrow,.wrow{position:absolute;left:0;right:0;display:flex}
.mrow{top:0;height:22px}.wrow{top:22px;height:22px}
.mrow div,.wrow div{flex:none;border-left:1px solid var(--line);font-size:11px;padding:3px 4px;color:var(--ink2);overflow:hidden;white-space:nowrap;font-weight:500}
.wrow div{color:var(--mut);border-left-color:var(--line2)}
.bar{position:absolute;top:7px;height:15px;border-radius:3px;background:var(--pend);overflow:visible}
.bar .bf{position:absolute;left:0;top:0;bottom:0;border-radius:3px 0 0 3px;background:rgba(0,0,0,.28)}
.bar.Terminada{background:var(--ok)}.bar.En-proceso{background:var(--prog)}.bar.Atrasada{background:var(--late)}.bar.Pendiente{background:var(--pend)}
.bar.sm2{top:10px;height:9px;border-radius:0;background:var(--acc)}
.bar.sm2::before,.bar.sm2::after{content:"";position:absolute;bottom:-5px;border:4px solid transparent;border-top-color:var(--acc);border-bottom:0}
.bar.sm2::before{left:0;border-left-color:var(--acc)}.bar.sm2::after{right:0;border-right-color:var(--acc)}
.bar.sm2 .bf{background:var(--hv);border-radius:0}
.bar.excl{opacity:.35}
.bb{position:absolute;bottom:3px;height:3px;background:var(--steel);border-radius:2px;opacity:.75}
.bl{position:absolute;top:7px;font-size:11px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ms{position:absolute;top:8px;width:13px;height:13px;transform:rotate(45deg);background:var(--hv);border:2px solid var(--ink);margin-left:-6px}
.ms.Terminada{background:var(--ok)}.ms.Atrasada{background:var(--late)}
.hd{cursor:ew-resize}
.bar .rz{position:absolute;right:-3px;top:0;bottom:0;width:8px;cursor:ew-resize;display:none}
body.edit .bar:not(.sm2){cursor:grab}body.edit .bar .rz{display:block}
.vline{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--late);z-index:2;pointer-events:none}
.vline.c{border-left:1px dashed var(--steel);opacity:.6;border-left-width:1px}
.vline em{position:absolute;top:2px;left:3px;font-size:10px;font-style:normal;background:var(--late);color:#fff;padding:0 4px;border-radius:3px}
@media(max-width:760px){.gc.d,.gc.dt,.gc.p.opt{display:none}.gc.nm{width:180px}}
/* panel lateral */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18);z-index:60;transform:translateX(105%);transition:transform .18s ease;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
#drawer.open{transform:none}
@media(prefers-reduced-motion:reduce){#drawer{transition:none}}
.dh{position:sticky;top:0;background:var(--panel);z-index:2;padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:flex-start}
.dh h3{flex:1;font-size:17px;line-height:1.25}
.ds{padding:14px 16px;border-bottom:1px solid var(--line2)}
.ds h4{font-size:13px;color:var(--ink2);margin-bottom:8px}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fg .full{grid-column:1/-1}
.fg label,.f label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
.fg input,.fg select,.f input,.f select,.f textarea{width:100%;color:var(--ink)}
.cli{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.cli .dot{width:18px;height:18px;border-radius:50%;flex:none;margin-top:1px;border:2px solid var(--pend);background:transparent;font-size:10px;display:grid;place-items:center;color:#fff}
.cli .dot.SI{background:var(--ok);border-color:var(--ok)}.cli .dot.NO{background:var(--late);border-color:var(--late)}.cli .dot.NA{background:var(--pend);border-color:var(--pend)}
/* modal */
#modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;background:rgba(10,17,24,.55);overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px 30px}
#modal.open{display:flex}
.mbox{background:var(--panel);border-radius:12px;width:min(780px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto 0}
.mbox.wide{width:min(980px,100%)}
.mh{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}.mh h3{flex:1;font-size:18px}
.mb{padding:16px 18px}.mf{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--panel);border-radius:0 0 12px 12px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px 16px;text-align:center;color:var(--ink2);cursor:pointer}
.drop.over{border-color:var(--hv);background:var(--sel)}
/* inspección */
.irow{border:1px solid var(--line2);border-radius:8px;padding:10px;margin-bottom:8px}
.irow .q{font-weight:500;margin-bottom:6px;display:flex;gap:8px;justify-content:space-between}
.irow .q small{font-weight:400;color:var(--mut);white-space:nowrap}
.srg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.srg button{border:0;border-right:1px solid var(--line);background:var(--panel);padding:5px 14px;cursor:pointer;font-weight:600;color:var(--ink2)}
.srg button:last-child{border-right:0}
.srg button.on.SI{background:var(--ok);color:#fff}.srg button.on.NO{background:var(--late);color:#fff}.srg button.on.NA{background:var(--pend);color:#fff}
.irow .ob{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}.irow .ob input[type=text]{flex:1;min-width:160px}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.dec{position:sticky;top:6px;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:8px 12px;border-radius:8px;font:700 15px 'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;text-align:center}
.dec.lib{background:var(--okbg);color:var(--ok)}.dec.nolib{background:var(--latebg);color:var(--late)}.dec.pend{background:var(--pendbg);color:var(--pend)}
/* curva */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font-size:11px;font-family:inherit}
.chart .gl2{stroke:var(--line2)}.chart .ax{stroke:var(--line)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tip{position:fixed;z-index:90;background:var(--ink);color:var(--panel);padding:7px 10px;border-radius:7px;font-size:12px;pointer-events:none;box-shadow:var(--shadow);line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:9px;z-index:100;max-width:90vw}
.toast.err{background:var(--late);color:#fff}
body.ro .w{display:none!important}
.hide{display:none!important}
.wl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.dz{border:1px solid var(--late);border-radius:10px;padding:12px 14px}
details.dz summary{cursor:pointer;font-weight:600;color:var(--late)}
.tpl-item{display:flex;gap:6px;margin-bottom:6px}.tpl-item input{flex:1}
.pill{display:inline-block;background:var(--pendbg);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--ink2)}
.ind{display:inline-block}

body.edit .gc.d{width:66px}body.edit .gc.dt{width:122px}
.bar.excl{background:var(--pend)!important;opacity:.4}.bar.excl .bf{background:rgba(0,0,0,.2)}
.ms.excl{background:var(--pend)!important;border-color:var(--mut)!important;opacity:.6}
.grow.ex .gc.p,.grow.ex .gc.p.b{color:var(--mut)!important;font-weight:400}
.nw{white-space:nowrap}

@media(max-width:760px){
 .gc.id,.gc.p.pr{display:none}.gc.nm{width:158px}
 .top{padding:6px 12px;gap:8px}.brand b{font-size:16px}.brand span{display:none}
 .bar-tools.prog{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.bar-tools.prog>*{flex:none}
 #gq{width:150px!important}
 main{padding:10px 10px 60px}.tabs{padding:10px 10px 0}
 #gscroll{max-height:calc(100vh - 200px);min-height:260px}
 .mbox{border-radius:10px}.mb{padding:12px}
}

body.edit .bar:not(.sm2){touch-action:none}

.rhero{display:flex;align-items:center;gap:18px;background:var(--nav);color:var(--navink);border-radius:10px;padding:14px 20px;margin-bottom:14px;flex-wrap:wrap;box-shadow:var(--shadow)}
.rhero img{height:108px;width:auto;flex:none;display:block}
.rh-t{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.rh-t h2{font-size:22px;color:inherit}
.rh-t span,.rh-c{font-size:12px;opacity:.75}
@media (max-width:560px){.rhero{padding:12px 16px;gap:12px}.rhero img{height:60px}.rh-t h2{font-size:18px}.rh-c{width:100%}}

/* ---- acceso (Firebase) ---- */
#auth{position:fixed;inset:0;z-index:200;background:var(--nav);color:var(--navink);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
#auth[hidden]{display:none!important}
.au-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
.au-logo{display:flex;justify-content:center}.au-logo img{height:150px;width:auto}
.au-card{background:var(--panel);color:var(--ink);border-radius:12px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px}
.au-card h2{font-size:20px}
.au-card label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.au-card input{border:1px solid var(--line);border-radius:7px;padding:9px 10px;background:var(--panel);font-size:15px}
.au-card input:focus{outline:2px solid var(--prog);outline-offset:1px}
.au-card .btn{justify-content:center;padding:10px}
.au-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.au-links button{background:none;border:0;padding:0;color:var(--prog);cursor:pointer;text-decoration:underline}
.au-msg{font-size:13px;border-radius:7px;padding:8px 10px}
.au-msg.err{background:var(--latebg);color:var(--late)}.au-msg.ok{background:var(--okbg);color:var(--ok)}
.au-foot{text-align:center;font-size:12px;opacity:.6}
.acct{display:flex;align-items:center;gap:8px;font-size:12px}
.acct .who{opacity:.85;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .rol{background:rgba(255,255,255,.14);border-radius:5px;padding:1px 7px;font-size:11px;letter-spacing:.03em;text-transform:uppercase}
.acct .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:inherit}
.ut td{vertical-align:middle}.ut select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.rol-pendiente{color:var(--real);font-weight:600}
body:not(.isadm) .adm{display:none!important}
.live{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:999px;padding:3px 10px 3px 6px;font-size:12px;cursor:pointer}
.live .av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:#4a7fe0;color:#fff;margin-left:-6px;border:2px solid var(--nav)}
.live .av:first-child{margin-left:0}.live .av.ed{background:#f2b01e;color:#13212f}
.libbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px}
.libbox.liberada{border-color:var(--ok);background:color-mix(in srgb,var(--okbg) 55%,transparent)}
.libbox.rechazada{border-color:var(--late);background:color-mix(in srgb,var(--latebg) 55%,transparent)}
.libbox.pend{border-color:var(--prog);background:color-mix(in srgb,var(--progbg) 45%,transparent)}
.libbox h4{font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.libbox .firma{background:#fff;border:1px solid var(--line);border-radius:6px;max-width:260px;height:auto;display:block;margin-top:6px}
#sigpad{width:100%;height:170px;background:#fff;border:2px dashed var(--line);border-radius:8px;touch-action:none;cursor:crosshair;display:block}
.chk{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}.chk label{display:flex;gap:4px;align-items:center;white-space:nowrap}
.fg .chk label,.f .chk label{flex-direction:row;font-size:13px;color:var(--ink)}.fg .chk input,.f .chk input{width:auto}
.ut td{padding:8px 10px}.ut details summary{cursor:pointer;font-size:12px;color:var(--prog)}
.act-li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line2);font-size:13px}.act-li:first-child{border-top:0}
.tag-b{background:var(--progbg);color:var(--prog);border-radius:5px;padding:0 6px;font-size:11px;font-weight:600}
</style>

const pad2=n=>String(n).padStart(2,'0');
const dn=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?Math.floor(Date.UTC(+m[1],+m[2]-1,+m[3])/DAY):null};
const sd=n=>{if(n==null||isNaN(n))return '';const d=new Date(n*DAY);return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate())};
const wday=n=>(((n+4)%7)+7)%7; // 0=Dom
const todayN=()=>{const t=new Date();return Math.floor(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/DAY)};
const mondayN=n=>n-((wday(n)+6)%7);
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtN=(n,y)=>{if(n==null)return '—';const d=new Date(n*DAY);return pad2(d.getUTCDate())+' '+MESES[d.getUTCMonth()]+(y===false?'':' '+String(d.getUTCFullYear()).slice(2))};

/* ---- calendario laboral ---- */
function mkCal(cfg){const dias=(cfg&&cfg.dias&&cfg.dias.length)?cfg.dias:[1,2,3,4,5,6];const inh=new Set(((cfg&&cfg.inh)||[]).map(dn).filter(x=>x!=null));return{dias,inh,wpw:dias.length}}
const isW=(n,c)=>c.dias.includes(wday(n))&&!c.inh.has(n);
function nextW(n,c){let k=0;while(!isW(n,c)&&k++<400)n++;return n}
function prevW(n,c){let k=0;while(!isW(n,c)&&k++<400)n--;return n}
function addW(n,k,c){ // mueve k dias laborables (k puede ser negativo); n se normaliza a laborable
  if(k>=0){n=nextW(n,c);while(k>0){n++;n=nextW(n,c);k--}return n}
  n=prevW(n,c);while(k<0){n--;n=prevW(n,c);k++}return n}

function workBetween(a,b,c){if(b<a)return 0;let k=0;for(let x=a;x<=b;x++)if(isW(x,c))k++;return k}

const queues={};
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).then(fn);queues[key]=p.catch(()=>{});return p}
function setSync(s){S.sync=s;const el=$('#sync');if(!el)return;el.className='sync '+(s==='saving'?'saving':s==='err'?'err':S.mode==='local'?'local':'');

function fail(e){
  if(e&&(e.code==='invalid_argument'||e.code==='permission-denied')&&S.canWrite){S.canWrite=false;document.body.classList.add('ro');setSync('idle');toast('Tu acceso es de solo lectura: los cambios no se guardaron.','err');render();return}
  setSync('err');toast('No se pudo guardar ('+((e&&(e.code||e.message))||'error')+'). Intenta de nuevo.','err')}
async function dbSet(coll,id,body){if(!db)return;setSync('saving');try{await enqueue(coll+'/'+id,()=>db.collection(coll).doc(id).set(body));setSync('idle')}catch(e){fail(e)}}
async function dbDel(coll,id){if(!db)return;try{await enqueue(coll+'/'+id,()=>db.collection(coll).doc(id).delete())}catch(e){fail(e)}}
function saveMeta(p){p.upd=Date.now();const i=S.proy.findIndex(x=>x.id===p.id);if(i>=0)S.proy[i]=p;else S.proy.push(p);touch();lsSave();if(db)dbSet('proyectos',p.id,clone(p));else setSync('idle')}
const progTimers={};
function saveProg(pid){pid=pid||S.cur;S.dirty[pid]=true;if(Date.now()-(S._lp||0)>600000){S._lp=Date.now();logAct('actualizó el programa de obra')}else if(typeof PRES!=='undefined')PRES.lastEdit=Date.now();touch();clearTimeout(progTimers[pid]);progTimers[pid]=setTimeout(()=>flushProg(pid),350);setSync('saving')}
async function flushProg(pid){
  const tasks=S.prog[pid]||[];lsSave();
  if(!db){S.dirty[pid]=false;setSync('idle');return}
  const chunks=[];let cur=[],size=0;
  for(const t of tasks){const l=JSON.stringify(t).length+1;if(size+l>150000&&cur.length){chunks.push(cur);cur=[];size=0}cur.push(t);size+=l}
  chunks.push(cur);const old=S.nch[pid]||0;S.nch[pid]=chunks.length;setSync('saving');
  try{
    for(let k=0;k<chunks.length;k++){const body={pid,k,n:chunks.length,t:chunks[k]};await enqueue('programas/'+pid+'_'+k,()=>db.collection('programas').doc(pid+'__'+k).set(body))}
    for(let k=chunks.length;k<old;k++)await enqueue('programas/'+pid+'_'+k,()=>db.collection('programas').doc(pid+'__'+k).delete());
    S.dirty[pid]=false;setSync('idle')
  }catch(e){S.dirty[pid]=false;fail(e)}}

async function exportFile(base,sheets){ // sheets: {Nombre:[[fila],...]}
  if(!dl){toast('La descarga no está disponible en esta vista.','err');return}
  try{
    let ok=false;
    try{await needXLSX();const wb=XLSX.utils.book_new();for(const n in sheets){const ws=XLSX.utils.aoa_to_sheet(sheets[n]);ws['!cols']=(sheets[n][0]||[]).map((_,c)=>({wch:Math.min(60,Math.max(10,...sheets[n].slice(0,60).map(r=>String(r[c]??'').length)))}));XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31))}
      const out=XLSX.write(wb,{type:'array',bookType:'xlsx'});await dl.save({filename:base+'.xlsx',data:out});ok=true}catch(e){if(e&&e.code==='declined')return;if(e&&e.code)throw e}
    if(!ok){const first=Object.keys(sheets)[0];const csv='\ufeff'+sheets[first].map(r=>r.map(c=>{const s=String(c??'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');await dl.save({filename:base+'.csv',data:csv})}
    toast('Archivo listo')
  }catch(e){if(e&&e.code!=='declined')toast('No se pudo exportar ('+(e.code||e.message)+').','err')}}

function visibleRows(P,C){

  if(filt){keep=new Array(n).fill(false);for(let i=0;i<n;i++){if(kids[i].length)continue;const okq=!q||strip(T[i].n).includes(q)||String(T[i].i).toLowerCase().includes(q);const okf=!f||C.R[i].st===f;if(okq&&okf){let k=i;while(k>=0&&!keep[k]){keep[k]=true;k=par[k]}}}}

const GDW={dia:26,sem:5,mes:2};
function ganttGeom(P){
  let a=1e9,b=-1e9;P.tasks.forEach(t=>{[t.s,t.f,t.bs,t.bf].forEach(x=>{const v=dn(x);if(v!=null){if(v<a)a=v;if(v>b)b=v}})});
  if(a>b){a=S.asOf;b=S.asOf+30}const t0=mondayN(a)-7,t1=b+21;return{t0,t1,dw:GDW[S.ui.zoom]||5,TW:(t1-t0+1)*(GDW[S.ui.zoom]||5)}}
function ganttHead(g){
  let mo='',wk='';const dw=g.dw;
  for(let d=g.t0;d<=g.t1;){const dt=new Date(d*DAY),y=dt.getUTCFullYear(),m=dt.getUTCMonth();const end=Math.min(g.t1,Math.floor(Date.UTC(y,m+1,1)/DAY)-1);
    const w=(end-d+1)*dw;mo+=`<div style="width:${w}px">${w>=44?MESES[m]+' '+String(y).slice(2):''}</div>`;d=end+1}

function ganttHTML(P,C){

function postGantt(keep){
  const sc=$('#gscroll');if(!sc)return;const gl=$('.ghead .gl');const lw=gl?gl.offsetWidth:600;const v=$('#vlw');if(v)v.style.left=lw+'px';

function chartHTML(cs,o){
  o=o||{};if(!cs)return '<div class="empty">Sin datos para graficar.</div>';
  const W=900,H=o.h||360,mL=46,mR=16,mT=14,mB=32,rows=cs.rows,d0=rows[0].d,d1=rows[rows.length-1].d,weekly=!o.mini&&S.ui.curva==='sem';
  const X=d=>mL+(d-d0)/Math.max(1,d1-d0)*(W-mL-mR);
  let ymax=1;if(weekly){ymax=0.05;for(let i=1;i<rows.length;i++){ymax=Math.max(ymax,rows[i].prog-rows[i-1].prog,rows[i].real!=null&&rows[i-1].real!=null?rows[i].real-rows[i-1].real:0)}ymax=Math.ceil(ymax*20)/20}
  const Y=v=>mT+(1-v/ymax)*(H-mT-mB);
  let g='';const step=weekly?(ymax>0.2?0.1:0.05):0.1;
  for(let v=0;v<=ymax+1e-9;v+=step){g+=`<line class="gl2" x1="${mL}" x2="${W-mR}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${mL-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`}
  for(let d=d0;d<=d1;d++){const dt=new Date(d*DAY);if(dt.getUTCDate()===1){g+=`<line class="gl2" x1="${X(d)}" x2="${X(d)}" y1="${mT}" y2="${H-mB}" style="opacity:.6"/><text x="${X(d)+3}" y="${H-mB+16}">${MESES[dt.getUTCMonth()]} ${String(dt.getUTCFullYear()).slice(2)}</text>`}}
  g+=`<line class="ax" x1="${mL}" x2="${W-mR}" y1="${H-mB}" y2="${H-mB}"/>`;

      s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--real)" stroke-width="3.2" stroke-linejoin="round"/>`}

  window._cv={cs,W,H,mL,mR,mT,mB,d0,d1,weekly,X};

function makeCorte(fechaStr,nota){
  const P=PR(),fn=dn(fechaStr),c=calcAll(P,calcInsps(),fn),snap={};
  P.tasks.forEach((t,i)=>{const r=c.R[i];if(r.leaf&&!r.ms&&r.w>0)snap[t.i]=Math.round(r.pc*100)});
  const rg=projectRange(P),m0=mondayN(rg?rg.a:fn);
  return{id:uid('k'),pid:P.id,fecha:fechaStr,sem:Math.floor((fn-m0)/7)+1,prog:c.tot.prog,repr:c.tot.repr,real:c.tot.real,term:c.tot.term,total:c.tot.total,atr:c.tot.atr,snap,nota:nota||'',creado:Date.now(),por:S.me.name||''}}

let IMP=null;const AI={ctl:null};
const FILE_ACCEPT='.xlsx,.xlsm,.xls,.ods,.csv,.tsv,.txt,.xml,.pdf,.docx,.mpp';
function parseCSV(txt){
  const first=txt.split('\n')[0]||'';const del=[',',';','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===del){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}

  const WDT=/[\s\u00a0]+(lun|mar|mi[eé]|jue|vie|s[aá]b|dom|mon|tue|wed|thu|fri|sat|sun)\.?$/i;
  const ents=[];let ix=0,hasDotId=false,hasIndent=false;
  for(const raw of text.split(/\r?\n/)){
    let id='',body=raw.replace(/\s+$/,'');
    const tb=body.indexOf('\t');
    if(tb>=0){const left=body.slice(0,tb).trim(),isId=/^\d+(?:\.\d+)*$/.test(left);if(isId||left===''){if(isId)id=left;body=body.slice(tb+1)}}
    body=body.replace(/\t/g,'  ');
    const ds=body.match(DRE);if(!ds||!ds.length)continue;
    let name=body.slice(0,body.indexOf(ds[0])).replace(/[\s.\-–:|]+$/,'');
    name=name.replace(WDT,'');let dur='';
    const dm=/[\s\u00a0]+(\d+(?:[.,]\d+)?)\s*(d[ií]as?|days?|sem(?:anas?)?|wks?|mons?)\??\s*$/i.exec(name);if(dm){dur=dm[1]+' '+dm[2];name=name.slice(0,dm.index)}
    const lead=/^( +)/.exec(name);const ind=lead?lead[1].length:0;name=name.trim();
    if(!id){const m=/^(\d+(?:\.\d+)+)[.)\s]\s*(.*)$/.exec(name)||/^(\d+)[.)]\s+(.*)$/.exec(name);if(m){id=m[1];name=m[2]}}
    if(!name)continue;if(id.includes('.'))hasDotId=true;if(ind)hasIndent=true;
    ents.push({id:id||String(++ix),name,dur,s:ds[0],f:ds[1]||ds[0],ind,lvl:id.includes('.')?id.split('.').length:1})}
  if(!ents.length)return{err:'No encontré renglones con actividad y fecha.'};
  const useLvl=hasDotId&&!hasIndent;
  const rows=[useLvl?['ID','Nombre de tarea','Duración','Inicio','Fin','Nivel']:['ID','Nombre de tarea','Duración','Inicio','Fin']];
  ents.forEach(e=>{const nm=useLvl?e.name:' '.repeat(e.ind)+e.name;rows.push(useLvl?[e.id,nm,e.dur,e.s,e.f,e.lvl]:[e.id,nm,e.dur,e.s,e.f])});

  for(let p=1;p<=Math.min(pdf.numPages,80);p++){const page=await pdf.getPage(p),tc=await page.getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:Math.round(i.transform[5])})).sort((a,b)=>b.y-a.y||a.x-b.x);
    let line=[],ly=null;const flush=()=>{if(line.length){line.sort((a,b)=>a.x-b.x);const k=line.findIndex(i=>!/^\d+(?:\.\d+)*$/.test(i.s.trim()));lines.push({it:line,k:k<0?line.length:k})}line=[]};
    for(const it of items){if(ly==null||Math.abs(it.y-ly)>3){flush();ly=it.y}line.push(it)}flush()}
  const xs=lines.filter(l=>l.k<l.it.length).map(l=>l.it[l.k].x);const minX=xs.length?Math.min(...xs):0;

async function readAny(file){

  if(/\.(csv|tsv)$/.test(name)){const txt=await file.text();const r=rowsToTasks(parseCSV(txt),{cfg});return r.err?{text:txt}:r}

async function aiTasks(text){
  const chunks=[];let cur='';for(const l of text.split('\n')){if(cur&&cur.length+l.length>9000){chunks.push(cur);cur=''}cur+=l+'\n'}if(cur.trim())chunks.push(cur);
  const all=[];
  for(let k=0;k<chunks.length;k++){setBusy(`Leyendo el programa con IA (parte ${k+1} de ${chunks.length})…`);
    const r=await sampleFn.json(AI_PROMPT+chunks[k],{modelTier:'default',signal:AI.ctl.signal});
    all.push(...(Array.isArray(r)?r:(r&&r.actividades)||[]))}
  if(!all.length)return{err:'La IA no encontró actividades en el texto.'};
  const rows=[['ID','Nombre de tarea','Duración','Inicio','Fin','Predecesoras','Nivel']].concat(all.map((a,i)=>[a.id?String(a.id):String(i+1),String(a.nombre||'').trim(),a.duracion!=null?String(a.duracion)+' days':null,a.inicio||null,a.fin||null,a.predecesoras||null,Math.max(1,parseInt(a.nivel)||1)]));
  const r=rowsToTasks(rows.filter((x,i)=>i===0||x[1]),{});if(!r.err)r.levelsFrom='lectura con IA';return r}

function normalizeTasks(P){const T=P.tasks;fixLevels(T);const{par,kids}=buildTree(T);

function editTask(id,k,v){
  if(!S.canWrite)return;const P=PR(),i=P.tasks.findIndex(t=>t.i===id);if(i<0)return;const t=P.tasks[i],cal=mkCal(P.cfg),os=dn(t.s),of=dn(t.f);let time=false,moved=[];
  switch(k){
   case'n':if(String(v).trim())t.n=String(v).trim();break;
   case'r':t.r=String(v).trim();break;
   case'o':t.o=String(v);break;
   case'x':t.x=v?1:0;break;
   case'hc':t.hc=v||'';break;
   case'pm':t.pm=Math.min(100,Math.max(0,parseFloat(v)||0));break;
   case'tp':t.tp=v||'';t.cl=null;break;
   case'p':t.p=String(v).trim();time='links';break;
   case's':{const x=dn(v);if(x==null)return;t.s=sd(x);t.f=sd(t.ms?x:finishFrom(x,t.d,cal));time=true;break}
   case'd':{const d=Math.max(0,parseFloat(String(v).replace(',','.'))||0);const s=dn(t.s);t.d=d;t.f=sd(d>0?finishFrom(s,d,cal):s);t.ms=d>0?0:1;if(d>0&&!t.tp&&!(t.cl&&t.cl.length))t.tp=matchTpl(t.n);time=true;break}

  saveProg();render()}

function sigInit(){

  c.onpointerdown=e=>{down=true;try{c.setPointerCapture(e.pointerId)}catch(_){}const p=pt(e);lx=p.x;ly=p.y;x.beginPath();x.arc(lx,ly,1.2,0,7);x.fill();SIG.drawn=true;e.preventDefault()};

  const u=ACC.users.find(x=>x.id===id);if(!u)return;
  try{await FS.collection('usuarios').doc(id).update(ch);Object.assign(u,ch);
    if(u.email&&ACC.invs.some(v=>v.id===u.email)){await FS.collection('invitaciones').doc(u.email).delete().catch(()=>{});ACC.invs=ACC.invs.filter(v=>v.id!==u.email)}
    await recomputeEquipo();toast('Acceso actualizado.')}
  catch(e){toast('No se pudo actualizar ('+(e.code||e.message)+').','err')}
  renderUsers()}
async function giveAccess(){
  const email=($('#ac-e').value||'').trim().toLowerCase(),rol=$('#ac-r').value,pids=[...document.querySelectorAll('input[name="ac-p"]:checked')].map(x=>x.value);
  if(!validEmail(email))return toast('Escribe un correo válido.','err');
  const bf=isBafarEmail(email);if(!bf&&!pids.length)return toast('Elige al menos un proyecto.','err');
  const u=ACC.users.find(x=>String(x.email||'').toLowerCase()===email);
  try{
    if(u){const ch=bf?{proyectos:pids}:{rol,proyectos:pids};await FS.collection('usuarios').doc(u.id).update(ch);Object.assign(u,ch);
      if(ACC.invs.some(v=>v.id===email)){await FS.collection('invitaciones').doc(email).delete().catch(()=>{});ACC.invs=ACC.invs.filter(v=>v.id!==email)}}
    else if(!bf){const v={email,rol,proyectos:pids,por:AUTH.user.email,ts:Date.now()};await FS.collection('invitaciones').doc(email).set(v);ACC.invs=ACC.invs.filter(x=>x.id!==email).concat([{id:email,...v}])}
    await recomputeEquipo()}
  catch(e){return toast('No se pudo dar el acceso ('+(e.code||e.message)+').','err')}
  const names=projNames(pids);
  sendMail([email],'Acceso a la plataforma de control de obra de Grupo Bafar',mailHTML('Tienes acceso a la plataforma',[
    ['Proyecto(s)',bf?'Todos (administrador Bafar)':names.join(', ')],['Permiso',bf?'Administrador':ROLES[rol]],['Te dio acceso',(AUTH.nombre||'')+' ('+AUTH.user.email+')'],
    ['Cómo entrar',u?'Entra con tu correo y contraseña de siempre.':'Toca el botón, elige «Crear cuenta» con este mismo correo y verifica el link que te llegará.']],location.origin+location.pathname,u?'Entrar':'Crear mi cuenta'));
  toast(u?'Acceso actualizado.':bf?'Los correos Bafar entran como administradores al registrarse. Se le envió el link.':'Acceso listo: entrará en cuanto se registre.');renderUsers()}
document.addEventListener('change',ev=>{const el=ev.target,d=el.dataset||{};
  if(d.acrol){updUser(d.acrol,{rol:el.value});return}
  if(d.acp){const u=ACC.users.find(x=>x.id===d.acp);if(!u)return;const s=new Set(u.proyectos||[]);el.checked?s.add(el.value):s.delete(el.value);updUser(u.id,{proyectos:[...s]});return}});
document.addEventListener('click',async ev=>{const b=ev.target.closest&&ev.target.closest('[data-fb]');if(!b)return;const a=b.dataset.fb;
  if(a==='logout'){try{if(AUTH.user)await FS.collection('presencia').doc(AUTH.user.uid).delete()}catch(e){}firebase.auth().signOut();return}
  if(a==='users'){openUsers();return}
  if(a==='live'){openLive();return}
  if(a==='acgive'){giveAccess();return}
  if(a==='acinvdel'){try{await FS.collection('invitaciones').doc(b.dataset.e).delete();ACC.invs=ACC.invs.filter(v=>v.id!==b.dataset.e);await recomputeEquipo();renderUsers()}catch(e){toast('No se pudo quitar ('+(e.code||e.message)+').','err')}return}
  if(a==='ejsave'){const c={publicKey:$('#ej-pk').value.trim(),serviceId:$('#ej-sv').value.trim(),templateId:$('#ej-tp').value.trim()};
    try{await FS.collection('config').doc('emailjs').set(c);EMAILCFG=c;toast('Configuración de correos guardada.');renderUsers()}catch(e){toast('No se pudo guardar ('+(e.code||e.message)+').','err')}return}
  if(a==='ejtest'){const ok=await sendMail([AUTH.user.email],'Prueba de avisos · Control de obra Bafar',mailHTML('Correo de prueba',[['Resultado','Si lees esto, los avisos por correo ya funcionan.']],location.origin+location.pathname));if(ok)toast('Correo de prueba enviado a '+AUTH.user.email+'.');return}
  if(a==='vsend'){const w=Math.ceil((VSENT+60000-Date.now())/1000);if(w>0){AU.msg='Espera '+w+' segundos antes de pedir otro correo.';AU.kind='err';renderAuth();return}
    try{await sendVerif(AUTH.user);VSENT=Date.now();AU.msg='Correo enviado a '+AUTH.user.email+'. Puede tardar unos minutos; revisa también correo no deseado.';AU.kind='ok'}catch(e){AU.msg=auErr(e)+' [código: '+((e&&e.code)||'?')+']';AU.kind='err'}renderAuth();return}
  if(a==='vcheck'){AU.busy=true;renderAuth();try{await AUTH.user.reload();await AUTH.user.getIdToken(true)}catch(e){}AU.busy=false;
    if(firebase.auth().currentUser&&firebase.auth().currentUser.emailVerified){onUser(firebase.auth().currentUser)}else{AU.msg='Todavía no aparece verificado. Abre el link del correo y vuelve a intentar.';AU.kind='err';renderAuth()}return}
  if(a.startsWith('v-')){AU={view:a.slice(2),msg:'',kind:'',busy:false};renderAuth();setTimeout(()=>{const i=$('#au-card input');if(i)i.focus()},0)}});

/* ================= SESIÓN ================= */
function stopData(){
  AUTH.unsub.forEach(u=>{try{u()}catch(e){}});AUTH.unsub=[];db=null;assets=null;AUTH.key='';
  if(PRES.unsub){PRES.unsub();PRES.unsub=null}if(ACT.unsub){ACT.unsub();ACT.unsub=null}PRES.timers.forEach(clearInterval);PRES.timers=[];PRES.pid=undefined;PRES.list=[];ACT.ev=[];renderLive();
  S.proy=[];S.prog={};S.insps=[];S.cortes=[];S.libs={};S.nch={};S.dirty={};S.ready=false;touch()}
function startData(){
  if(db)return;db=fsAdapter(FS);S.mode='db';
  S.canWrite=AUTH.admin||AUTH.rol==='editor';assets=S.canWrite?fbAssets:null;
  S.me.name=AUTH.nombre||(AUTH.user.email||'');S.me.id=AUTH.user.uid;
  loadEmailCfg();subscribeAll();
  PRES.timers.push(setInterval(presBeat,45000),setInterval(renderLive,30000));
  setTimeout(()=>{if(!S.ready){S.ready=true;render()}},7000);render()}
function applyRole(x){
  if(x.nombre)AUTH.nombre=x.nombre;
  const rol=AUTH.bafar?'admin':(x.rol||'pendiente'),proys=AUTH.bafar?[]:(x.proyectos||[]).filter(Boolean);
  AUTH.rol=rol;AUTH.admin=AUTH.bafar;
  const ok=AUTH.bafar||(['editor','lector'].includes(rol)&&proys.length>0);
  if(!ok){stopData();AUTH.ok=false;AU={view:'pend',msg:'',kind:'',busy:false};renderAuth();authShow(true);renderAcct();return}
  AUTH.ok=true;authShow(false);
  const key=rol+'|'+proys.slice().sort().join(',');
  if(db&&key===AUTH.key){S.canWrite=AUTH.admin||rol==='editor';renderAcct();render();return}
  stopData();AUTH.key=key;AUTH.proys=proys;startData();renderAcct()}
let roleUnsub=null;
async function onUser(u){
  if(roleUnsub){roleUnsub();roleUnsub=null}
  stopData();AUTH.user=u;AUTH.rol=null;AUTH.admin=false;AUTH.bafar=false;AUTH.ok=false;AUTH.invTried=false;
  if(!u){AUTH.nombre='';AU={view:AU.view==='signup'||AU.view==='reset'?AU.view:'login',msg:AU.msg,kind:AU.kind,busy:false};renderAuth();authShow(true);renderAcct();return}
  AUTH.nombre=u.displayName||AUTH.pendingName||'';
  const email=String(u.email||'').toLowerCase(),ref=FS.collection('usuarios').doc(u.uid);
  if(!u.emailVerified){
    ref.get().then(d=>{if(!d.exists)return ref.set({nombre:AUTH.nombre,email,rol:'pendiente',proyectos:[],creado:SVT()})}).catch(()=>{});
    const ve=AU.vErr;AU={view:'verify',msg:ve?'No se pudo enviar el correo de verificación: '+auErr(ve)+' [código: '+(ve.code||'?')+']. Usa «Reenviar el correo» en unos minutos.':'',kind:ve?'err':'',busy:false};renderAuth();authShow(true);renderAcct();return}
  AUTH.bafar=isBafarEmail(email);
  $('#au-card').innerHTML='<h2>Entrando…</h2>';
  roleUnsub=ref.onSnapshot(async d=>{
    if(!d.exists){try{await ref.set({nombre:AUTH.nombre,email,rol:'pendiente',proyectos:[],creado:SVT()})}catch(e){}if(!AUTH.bafar)return}
    const x=d.exists?d.data():{};
    if(!AUTH.bafar&&(x.rol||'pendiente')==='pendiente'&&!AUTH.invTried){AUTH.invTried=true; // ¿un administrador ya le dio acceso antes de registrarse?
      try{const inv=await FS.collection('invitaciones').doc(email).get();if(inv.exists){const v=inv.data();await ref.update({rol:v.rol,proyectos:v.proyectos||[]});return}}catch(e){}}
    applyRole(x)},
    e=>{AU={view:'login',msg:'No se pudo leer tu perfil ('+(e.code||e.message)+'). Revisa que las reglas de Firestore estén publicadas.',kind:'err',busy:false};renderAuth();authShow(true)})}
async function init(){
  $('#au-logo').src=LOGO_BAFAR;prefLoad();S.libs={};render();
  dl=fbDownloads;
  if(!window.firebase||!FIREBASE_CONFIG.apiKey||!FIREBASE_CONFIG.projectId){AU.view='config';
    if(!window.firebase){$('#au-card').innerHTML='<h2>Sin conexión</h2><p style="margin:0">No se pudieron cargar los servicios de Firebase. Revisa tu conexión a internet y recarga la página.</p>';return}
    renderAuth();return}
  firebase.initializeApp(FIREBASE_CONFIG);FS=firebase.firestore();
  firebase.auth().onAuthStateChanged(onUser);
  window.addEventListener('pagehide',()=>{if(AUTH.user&&FS)FS.collection('presencia').doc(AUTH.user.uid).delete().catch(()=>{})})}
init();

</script>
